<div class="card-container">
    <h1>CADASTRO DE ALUNOS</h1>
    <form #alunoForm="ngForm" (ngSubmit)="cadastrarAluno(alunoForm)">

      <div class="campo">
        <p class="identificador">Nome do aluno</p>
        <input type="text" [(ngModel)]="aluno.nome" name="nome" placeholder="Insira o nome do aluno">
      </div>
      
      <div class="campo">
        <p class="identificador">Bairro:</p>
        <input type="text" [(ngModel)]="aluno.bairro" name="nome" placeholder="Insira o bairro do aluno">
      </div>
      
      <div class="campo">
        <p class="identificador">Data de nascimento:</p>
        <input type="date" [(ngModel)]="aluno.data_nascimento" name="nome" placeholder="Insira o bairro do aluno">
      </div>
      
      <div class="campo">
        <p class="identificador">Insira o curso do aluno</p>
      <select [(ngModel)]="aluno.curso" name="curso">
        
        <option value="" disabled selected>(Selecione o Curso)</option>

        @for(curso of cursos; track curso){
          <option [value]="curso.id">{{curso.nome}}</option>
        }
      </select>
      
      <button type="submit" class="btn-salvar">Salvar Aluno</button>
      
    </div>
    </form>
  </div>
